databaseChangeLog:
  - changeSet:
      id: catalog-search-tables
      author: template-service
      changes:
        - sql:
            sql: |
              CREATE TABLE catalog_item (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name VARCHAR(160) NOT NULL,
                status VARCHAR(16) NOT NULL CHECK (status IN ('ACTIVE', 'ARCHIVED')),
                price_cents BIGINT NOT NULL CHECK (price_cents >= 0),
                description TEXT
              );
              CREATE TABLE catalog_revision (
                id INTEGER PRIMARY KEY CHECK (id = 1),
                revision BIGINT NOT NULL
              );
              INSERT INTO catalog_revision (id, revision) VALUES (1, 0);
              CREATE INDEX catalog_item_name_id_idx ON catalog_item (name, id);
              CREATE INDEX catalog_item_price_id_idx ON catalog_item (price_cents, id);
              CREATE INDEX catalog_item_status_id_idx ON catalog_item (status, id);
      rollback:
        - sql:
            sql: |
              DROP TABLE catalog_item;
              DROP TABLE catalog_revision;
  - changeSet:
      id: catalog-search-postgres-prefix
      author: template-service
      dbms: postgresql
      changes:
        - sql:
            sql: CREATE INDEX catalog_item_prefix_idx ON catalog_item (lower(name) text_pattern_ops)
      rollback:
        - sql:
            sql: DROP INDEX catalog_item_prefix_idx
  - changeSet:
      id: catalog-search-postgres-revision
      author: template-service
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION bump_catalog_revision() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                UPDATE catalog_revision SET revision = revision + 1 WHERE id = 1;
                RETURN NULL;
              END;
              $$;
        - sql:
            sql: |
              CREATE TRIGGER catalog_item_revision
              BEFORE INSERT OR UPDATE OR DELETE OR TRUNCATE ON catalog_item
              FOR EACH STATEMENT EXECUTE FUNCTION bump_catalog_revision();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER catalog_item_revision ON catalog_item;
              DROP FUNCTION bump_catalog_revision();
  - changeSet:
      id: catalog-search-h2-revision
      author: template-service
      dbms: h2
      changes:
        - sql:
            sql: |
              CREATE TRIGGER catalog_item_revision
              BEFORE INSERT, UPDATE, DELETE ON catalog_item
              FOR EACH ROW CALL "${catalogTriggerClass}";
      rollback:
        - sql:
            sql: DROP TRIGGER catalog_item_revision
