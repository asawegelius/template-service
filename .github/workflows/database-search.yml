name: Database search

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  postgres:
    name: PostgreSQL integration and performance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: template_search
          POSTGRES_USER: template_test
          POSTGRES_PASSWORD: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template_test -d template_search"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEARCH_TEST_DB_URL: jdbc:postgresql://localhost:5432/template_search
      SEARCH_TEST_DB_USERNAME: template_test
      SEARCH_TEST_DB_PASSWORD: template_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew postgresTest --no-daemon
